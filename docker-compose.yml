services:

    receita_web:
        build: .
        env_file:
            - .env
        restart: always
        ports:
            - 8001:8000
        depends_on:
            - receita_db
        volumes:
          - .:/app
        # develop:
        #   watch:
        #     - action: sync+restart # this depends on the project
        #       path: .
        #       target: /app
        #
        #       ignore:
        #         - .venv/
        #         - __pycache__/

    receita_db:
        image: postgres:16
        ports:
            - 5433:5432
        volumes:
            - postgres_data:/var/lib/postgresql/data/
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=receita

volumes:
    postgres_data:

